# SonarQube / SonarCloud - Análisis de código estático
# Para SonarCloud: configurar organization y projectKey en el panel de SonarCloud
# o pasarlos como propiedades del sistema (-Dsonar.organization=xxx -Dsonar.projectKey=xxx)

sonar.projectKey=eduardorrdev_java-serenity-cucumber-pom-
sonar.organization=eduardorrdev

sonar.projectName=java-serenity-cucumber-pom
sonar.projectVersion=1.0

# Código fuente (proyecto de tests: todo el código está en src/test)
sonar.sources=src/test/java
sonar.tests=src/test/java
sonar.java.binaries=build/classes/java/test
sonar.java.test.binaries=build/classes/java/test

# Exclusiones
sonar.exclusions=**/target/**,**/build/**,**/*.jar
sonar.test.exclusions=**/target/**,**/build/**

# Encoding
sonar.sourceEncoding=UTF-8
